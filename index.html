<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lara Family Tree</title>
  <link rel="stylesheet" href="lib/family-chart.css">
  <style type="text/css">
    html, body {
      margin: 0;
      height: 100%;
      background-color: #000;
      color: #fff;
    }
    body {
      font: 14px sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px 8px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font: 600 28px Georgia, serif;
      letter-spacing: 1px;
    }
    /* Member card: avatar on top, name underneath. */
    .f3 div.card-avatar {
      width: 120px;
      padding: 8px 6px;
      box-sizing: border-box;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .f3 div.card-avatar .person-icon {
      width: 72px;
      height: 72px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .f3 div.card-avatar .person-icon img,
    .f3 div.card-avatar .person-icon svg {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      object-fit: cover;
      border-radius: 50%;
    }
    .f3 div.card-avatar .card-label {
      margin-top: 6px;
      line-height: 1.2;
      word-break: break-word;
    }
    #FamilyChart {
      flex: 1;
      width: 100%;
      /* family-chart draws its connecting lines in white, so keep the
         background dark. */
      background-color: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Lara Family Tree</h1>
  </header>
  <div id="FamilyChart" class="f3"></div>

  <script src="lib/d3.v7.min.js"></script>
  <script src="lib/family-chart.min.js"></script>
  <script src="family-data.js"></script>
  <script>
    var chart = f3.createChart("#FamilyChart", familyTreeData);
    // Avatar above the name. To use a real photo, add an "avatar" field with
    // an image URL/path to a person's data in family-data.js.
    var defaultAvatar =
      '<svg viewBox="0 0 24 24" fill="#ddd" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>';
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    chart.setCardHtml()
      .setCardDim({ w: 120, h: 120 })
      .setCardInnerHtmlCreator(function (d) {
        var p = d.data.data;
        var name = esc((p["first name"] || "") + " " + (p["last name"] || "")).trim();
        var avatar = p.avatar
          ? '<img src="' + esc(p.avatar) + '" alt="' + name + '">'
          : defaultAvatar;
        return '<div class="card-inner card-avatar">' +
          '<div class="person-icon">' + avatar + '</div>' +
          '<div class="card-label">' + name + '</div>' +
          '</div>';
      });
    chart.setCardXSpacing(150).setCardYSpacing(170);
    // Show every generation at once instead of the library's default
    // focused view around the "main" person (first entry in the data).
    chart.setAncestryDepth(10).setProgenyDepth(10).setShowSiblingsOfMain(true);
    // The chart only shows the main person's ancestors and descendants, so
    // centre it on the oldest couple (Severino, id "16") to include every branch.
    chart.updateMainId("16");
    chart.updateTree({ initial: true });
  </script>
</body>
</html>
